<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas personales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
    <script src="js/dashboard.js" defer></script>
    <script src="js/gastos.js" defer></script>
</head>
<body>
    <main>
        <section id="vista-caracterizacion">
            <h1>Configuración inicial</h1>
            <form id="formulario-caracterizacion">
                <section>
                    <h2>Ingresos</h2>
                    <label for="ingreso-principal">Ingreso Mensual Principal</label>
                    <input type="number" id="ingreso-principal" name="ingreso-principal" required>

                    <label for="ingresos-adicionales">Ingresos Adicionales</label>
                    <input type="number" id="ingresos-adicionales" name="ingresos-adicionales">
                </section>

                <section>
                    <h2>Gastos Fijos Mensuales</h2>
                    <div id="lista-gastos-fijos"></div>
                    <button type="button" id="agregar-gasto">Agregar gasto fijo</button>
                </section>

                <button type="submit">Guardar Configuración</button>
            </form>
        </section>
        <section id="vista-dashboard" class="oculto">
            <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
                <div class="container-fluid">
                    <span class="navbar-brand">Finanzas personales</span>
                    <button type="button" id="resetear-configuracion" class="btn btn-outline-danger">Resetear / Reconfigurar</button>
                </div>
            </nav>

            <h1>Panel financiero</h1>
            <div class="row g-4">
                <div class="col-12 col-md-6 col-xl-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <h2 class="card-title h5">Ingresos Totales</h2>
                            <p id="total-ingresos" class="card-text fs-4">0</p>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-xl-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <h2 class="card-title h5">Gastos Fijos</h2>
                            <p id="total-gastos-fijos" class="card-text fs-4">0</p>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-xl-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <h2 class="card-title h5">Capacidad de Ahorro / Balance Inicial</h2>
                            <p id="saldo-disponible" class="card-text fs-4">0</p>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-xl-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <h2 class="card-title h5">Gastos Variables del Mes</h2>
                            <p id="gastos-variables" class="card-text fs-4">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <section>
                <h2>Gastos diarios</h2>
                <form id="formulario-gasto-diario" class="row g-3">
                    <div class="col-12 col-md-4">
                        <label for="concepto-gasto-diario" class="form-label">Concepto</label>
                        <input type="text" id="concepto-gasto-diario" class="form-control" required>
                    </div>
                    <div class="col-12 col-md-3">
                        <label for="monto-gasto-diario" class="form-label">Monto</label>
                        <input type="number" id="monto-gasto-diario" class="form-control" required>
                    </div>
                    <div class="col-12 col-md-3">
                        <label for="categoria-gasto-diario" class="form-label">Categoría</label>
                        <select id="categoria-gasto-diario" class="form-select" required>
                            <option value="Comida">Comida</option>
                            <option value="Ocio">Ocio</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Varios">Varios</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">Registrar gasto</button>
                    </div>
                </form>

                <div class="table-responsive mt-4">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Concepto</th>
                                <th>Monto</th>
                                <th>Categoría</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="lista-gastos-diarios"></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>
    <script src="js/caracterizacion.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
