<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas personales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <main>
        <section id="vista-caracterizacion">
            <h1>Configuración inicial</h1>
            <form id="formulario-caracterizacion">
                <section>
                    <h2>Ingresos</h2>
                    <label for="ingreso-principal">Ingreso Mensual Principal</label>
                    <input type="number" id="ingreso-principal" name="ingreso-principal" required>

                    <label for="ingresos-adicionales">Ingresos Adicionales</label>
                    <input type="number" id="ingresos-adicionales" name="ingresos-adicionales">
                </section>

                <section>
                    <h2>Gastos Fijos Mensuales</h2>
                    <div id="lista-gastos-fijos"></div>
                    <button type="button" id="agregar-gasto">Agregar gasto fijo</button>
                </section>

                <button type="submit">Guardar Configuración</button>
            </form>
        </section>
        <section id="vista-dashboard" class="oculto">
            <h1>Panel financiero</h1>
        </section>
    </main>
    <script src="js/caracterizacion.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
